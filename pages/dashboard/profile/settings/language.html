<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Language | SNAP</title>
        <link rel="stylesheet" href="../../../../designs/dashboard.css">
        <link rel="stylesheet" href="../../../../designs/settings/language.css">
    </head>
    <body>
        <div class="dashboard-shell profile-page">
            <aside class="sidebar" aria-label="Main navigation">
                <a class="brand" href="../../dashboard.html" aria-label="SNAP home">
                    <span class="brand-mark">S</span>
                    <span>
                        <strong>SNAP</strong>
                        <small>Workspace</small>
                    </span>
                </a>
                <nav class="primary-nav">
                    <a class="nav-item" href="../../dashboard.html">
                        <img class="nav-icon" src="../../../../assets/main icons/Vector.svg" alt="">Home
                    </a>
                    <a class="nav-item" href="../../tasks.html">
                        <img class="nav-icon" src="../../../../assets/main icons/check-square.svg" alt="">Tasks
                    </a>
                    <a class="nav-item" href="../../ai and chat/ai_and_chat.html">
                        <img class="nav-icon" src="../../../../assets/main icons/message-circle.svg" alt="">AI &amp; Chat
                    </a>
                    <a class="nav-item" href="../../badges.html">
                        <img class="nav-icon" src="../../../../assets/main icons/badge-check.svg" alt="">Badge
                    </a>
                    <a class="nav-item active" href="../profile.html">
                        <img class="nav-icon-active" src="../../../../assets/main icons/user.svg" alt="">Profile
                    </a>
                </nav>
                <div class="recent-notes">
                    <div class="recent-heading">
                        <h2>Recent Notes</h2>
                    
                    </div>
                    <div class="empty-recent" aria-hidden="true"></div>
                </div>
            </aside>

            <main class="dashboard-main profile-main settings-main">
                <div class="settings-header">
                    <a class="back-link" href="../profile.html" aria-label="Back to profile">
                        <img class="back-icon" src="../../../../assets/eva_arrow-ios-back-outline.svg" alt="Back icon">
                    </a>
                    <h1>Language</h1>
                </div>

                <section class="settings-panel" aria-label="Language settings panel">
                    <div class="settings-card">
                        <div class="setting-field select-field">
                            <label for="preferred-language">Preferred language</label>
                            <select id="preferred-language">
                                <option selected>English (US)</option>
                                <option>English (UK)</option>
                                <option>Filipino</option>
                                <option>Spanish</option>
                                <option>Japanese</option>
                            </select>
                        </div>

                        <div class="language-options" aria-label="Language options">
                            <label class="language-option">
                                <input type="radio" name="language" checked>
                                <span>English</span>
                            </label>
                            <label class="language-option">
                                <input type="radio" name="language">
                                <span>Filipino</span>
                            </label>
                            <label class="language-option">
                                <input type="radio" name="language">
                                <span>Spanish</span>
                            </label>
                        </div>
                    </div>

                    <div class="action-row">
                        <button class="secondary-button" type="button">Cancel</button>
                        <button class="primary-button" type="button">Save changes</button>
                    </div>
                </section>
            </main>
        </div>
    </body>
</html>
