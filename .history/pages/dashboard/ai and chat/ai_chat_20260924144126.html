<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>AI &amp; Chat | SNAP</title>
        <link rel="stylesheet" href="../../designs/dashboard.css">
        <link rel="stylesheet" href="../../designs/ai_chat.css">
        <style>
            .ai-landing-surface {
                justify-content: flex-start;
                padding-top: 18px;
            }

            .ai-landing-surface .chat-message {
                margin-top: 4px;
                padding-top: 0;
            }

            .ai-option-grid {
                display: grid;
                gap: 16px;
                margin-top: 18px;
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }

            .ai-option-card {
                display: flex;
                flex-direction: column;
                justify-content: center;
                min-height: 136px;
                padding: 22px 18px;
                border: 1px solid rgba(166, 183, 203, 0.7);
                border-radius: 18px;
                background: rgba(255, 255, 255, 0.46);
                color: #1f2d3d;
                text-decoration: none;
                box-shadow: 0 10px 22px rgba(43, 63, 89, 0.06);
                transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease;
            }

            .ai-option-card:hover {
                transform: translateY(-2px);
                border-color: rgba(110, 148, 207, 0.7);
                box-shadow: 0 14px 26px rgba(43, 63, 89, 0.12);
            }

            .option-label {
                font-size: clamp(18px, 1.8vw, 26px);
                font-weight: 800;
                letter-spacing: -0.04em;
                margin-bottom: 8px;
            }

            .option-copy {
                font-size: 12px;
                color: #5d6b7b;
                line-height: 1.5;
            }

            @media (max-width: 900px) {
                .ai-option-grid {
                    grid-template-columns: 1fr;
                }
            }
        </style>
    </head>
    <body>
        <div class="dashboard-shell">
            <div class="dashboard-content">
                <aside class="sidebar" aria-label="Main navigation">
                    <a class="brand" href="../dashboard.html" aria-label="SNAP home">
                        <span class="brand-mark">S</span>
                        <span>
                            <strong>SNAP</strong>
                            <small>Workspace</small>
                        </span>
                    </a>

                    <nav class="primary-nav">
                        <a class="nav-item" href="../dashboard.html">
                            <img class="nav-icon" src="../../assets/main icons/Vector.svg" alt="Home icon">
                            Home
                        </a>
                        <a class="nav-item" href="../tasks.html">
                            <img class="nav-icon" src="../../assets/main icons/check-square.svg" alt="Tasks icon">
                            Tasks
                        </a>
                        <a class="nav-item active" href="ai_chat.html">
                            <img class="nav-icon-active" src="../../assets/main icons/message-circle.svg" alt="AI chat icon">
                            AI Chat
                        </a>
                        <a class="nav-item" href="../badges.html">
                            <img class="nav-icon" src="../../assets/main icons/badge-check.svg" alt="Badge icon">
                            Badge
                        </a>
                        <a class="nav-item" href="../profile/profile.html">
                            <img class="nav-icon" src="../../assets/main icons/user.svg" alt="Profile icon">
                            Profile
                        </a>
                    </nav>

                    <div class="chat-utils">
                        <button class="new-chat-button" type="button">+ New Chat</button>
                        <button class="library-button" type="button">Library</button>
                    </div>

                    <div class="recent-notes" aria-label="Recent chat">
                        <h2>Recent Chat</h2>
                        <div class="empty-recent" aria-hidden="true"></div>
                    </div>
                </aside>

                <main class="dashboard-main ai-chat-panel" aria-label="AI & Chat landing page">
                    <div class="top-bar">
                        <a class="profile-placeholder" href="../profile/profile.html" aria-label="Open profile"></a>
                    </div>

                    <div class="chat-surface ai-landing-surface">
                        <div class="chat-message" aria-label="AI & Chat heading">AI &amp; Chat</div>

                        <div class="ai-option-grid">
                            <a class="ai-option-card" href="ai.html">
                                <span class="option-label">SNAP AI</span>
                                <span class="option-copy">Continue with your assistant.</span>
                            </a>

                            <a class="ai-option-card" href="ai_chat.html">
                                <span class="option-label">Shared Chats</span>
                                <span class="option-copy">Open collaborative conversations.</span>
                            </a>

                            <a class="ai-option-card" href="ai_chat.html">
                                <span class="option-label">Direct Chats</span>
                                <span class="option-copy">Start a one-to-one discussion.</span>
                            </a>
                        </div>
                    </div>
                </main>
            </div>
        </div>
    </body>
</html>
