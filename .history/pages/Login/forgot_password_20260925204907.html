<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | SNAP</title>
    <link rel="stylesheet" href="../../designs/login designs/forgot_password.css">
</head>
<body>
    <main class="forgot-page" aria-label="Forgot password form">
        <section class="forgot-card" aria-labelledby="forgot-title">
            <h1 id="forgot-title">Forgot Password</h1>
            <p class="instruction">Enter your email or username to reset your password.</p>

            <form class="forgot-form" action="#" method="post">
                <label class="sr-only" for="email-or-username">Email or username</label>
                <input type="text" id="email-or-username" name="email-or-username" placeholder="Email/Username" autocomplete="username" required>

                <button class="primary-button" type="submit">Send Reset Link</button>
            </form>

            <p class="back-link-row">
                <a href="login.html">Back to Log In</a>
            </p>
        </section>
    </main>
</body>
</html>
