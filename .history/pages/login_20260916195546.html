<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web page</title>
    <link rel="stylesheet" href="/designs/main.css">
</head>
<body>
    <div class="header">
        <h1>Welcome to SNAP</h1> 
        <h3>Learn smarter. Write better.</h3>      
    </div>

    <div class="login-container">
        <h1>Login</h1>
        <form action="/login" method="POST">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>
            <br>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
            <br>
            <button type="submit" <a href>Login</button>
            <p><a href="/forgot-password">Forgot password?</a></p>

            <p>or continue with</p>
            <button type="button" onclick="window.location.href='/login/google'">Google</button>
            <button type="button" onclick="window.location.href='/login/facebook'">Facebook</button>


            <p>Don't have an account? <a href="/register">Sign in</a></p>
            
        </form>



</body>
</html>
