<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Notes | SNAP</title>
        <link rel="stylesheet" href="../../designs/notes.css">
    </head>
    <body>
        <div class="dashboard-shell">
            <aside class="sidebar" aria-label="Main navigation">
                <a class="brand" href="../dashboard.html" aria-label="SNAP home">
                    <span class="brand-mark">S</span>
                    <span>
                        <strong>SNAP</strong>
                        <small>Workspace</small>
                    </span>
                </a>

                <nav class="primary-nav">
                    <a class="nav-item" href="../dashboard.html"><img class="nav-icon" src="../../assets/Vector.svg" alt="">Home
                    </a>
                    <a class="nav-item" href="../tasks.html"><img class="nav-icon" src="../../assets/check-square.svg" alt="">Tasks
                    </a>
                    <a class="nav-item" href="../ai_chat.html"><img class="nav-icon" src="../../assets/message-circle.svg" alt="">AI Chat
                    </a>
                    <a class="nav-item" href="../badges.html"><img class="nav-icon" src="../../assets/badge-check.svg" alt="">Badge
                    </a>
                    <a class="nav-item" href="../profile.html"><img class="nav-icon" src="../../assets/user.svg" alt="">Profile
                    </a>
                </nav>

                <div class="recent-notes">
                    <h2>Recent Notes</h2>
                    <div class="empty-recent" aria-hidden="true"></div>
                </div>
            </aside>

            <main class="dashboard-main notes-main">
                <header class="editor-header">
                    <button class="icon-button back-button" type="button" aria-label="Go back">‹</button>

                    <div class="title-block">
                        <div class="title-row">
                            <input type="text" value="Input Title" aria-label="Note title">
                            <span class="meta-separator">•</span>
                            <span class="meta-item">September 9</span>
                            <span class="meta-separator">•</span>
                            <span class="meta-item">2:04 PM</span>
                            <span class="meta-separator">•</span>
                            <span class="meta-item">0 words</span>
                        </div>
                    </div>

                    <div class="header-actions">
                        <button class="action-button save-button" type="button">Save</button>
                        <button class="action-button ghost-button" type="button">New note</button>
                        <button class="action-button ghost-button muted-button" type="button">All notes</button>
                        <button class="avatar-button" type="button" aria-label="User profile"></button>
                    </div>
                </header>

                <section class="editor-surface" aria-label="Note editor">
                    <div class="toolbar" aria-label="Formatting toolbar">
                        <div class="toolbar-group">
                            <button class="tool-button bold" type="button">B</button>
                            <button class="tool-button italic" type="button">I</button>
                            <button class="tool-button underline" type="button">U</button>
                            <button class="tool-button strike" type="button">S</button>
                        </div>

                        <div class="toolbar-group compact-group">
                            <button class="tool-button small" type="button">Inter</button>
                            <button class="tool-button small" type="button">14</button>
                            <button class="tool-button small" type="button">1.5</button>
                            <button class="tool-button small" type="button">—</button>
                            <button class="tool-button small" type="button">100%</button>
                            <button class="tool-button small" type="button">+</button>
                            <button class="tool-button small" type="button">−</button>
                            <button class="tool-button small" type="button">⟲</button>
                            <button class="tool-button small" type="button">⋯</button>
                        </div>
                    </div>

                    <div class="editor-body">
                        <div class="draft-status">
                            <span class="status-badge">Draft</span>
                            <span class="status-text">• Autosaved</span>
                            <span class="word-total">0 words</span>
                        </div>

                        <div class="editor-placeholder" aria-label="Write your note">Start writing your note...</div>
                    </div>
                </section>
            </main>
        </div>
    </body>
</html>
